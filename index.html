<!-- ══════ 부트 가드 · 모바일 파일열기(content:// · file://) 깨짐 차단 ══════ -->
<script>
(function () {
  var D = document, H = D.documentElement;

  function cssReady() {
    try { return !!(getComputedStyle(H).getPropertyValue('--bg') || '').trim(); }
    catch (e) { return true; }
  }
  function jsReady() {
    return !!(window.KAHUGO_DATA && window.KAHUGO_BOOK && window.KAHUGO_ROUTES);
  }
  function localScheme() {
    return /^(file|content|blob|android-app):/i.test(location.protocol);
  }

  function paint(reasons) {
    var box = D.getElementById('kahugo-boot');
    if (!box) return;

    var card = 'background:#0b1a30;border:1px solid #1d3557;border-radius:16px;padding:18px 16px;margin:0 0 12px';
    var num  = 'display:inline-block;min-width:24px;height:24px;line-height:24px;text-align:center;border-radius:999px;background:#2f7df6;color:#fff;font-weight:700;font-size:13px;margin-right:8px';
    var btn  = 'display:inline-block;margin:10px 8px 0 0;padding:11px 18px;border-radius:999px;background:#2f7df6;color:#fff;text-decoration:none;font-weight:700;font-size:14px;border:0;cursor:pointer';
    var btn2 = btn.replace('background:#2f7df6;color:#fff', 'background:transparent;color:#7ad6ec;border:1px solid #2f5f8f');
    var dim  = 'color:#8fa4bf;font-size:13px;line-height:1.75;margin:6px 0 0';

    box.innerHTML =
      '<div style="max-width:620px;margin:0 auto;padding:28px 18px 56px;' +
        'font:15px/1.75 -apple-system,BlinkMacSystemFont,\'Segoe UI\',system-ui,\'Apple SD Gothic Neo\',\'Malgun Gothic\',sans-serif;' +
        'color:#c6d5e8">' +

        '<div style="display:flex;align-items:center;gap:10px;margin-bottom:20px">' +
          '<svg viewBox="0 0 96 96" width="38" height="38" aria-hidden="true">' +
            '<rect width="96" height="96" rx="24" fill="#2f7df6"/>' +
            '<path d="M30 24V72" stroke="#06152b" stroke-width="11.5" stroke-linecap="round" fill="none"/>' +
            '<path d="M67 24 38 48 67 72" stroke="#06152b" stroke-width="11.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>' +
            '<circle cx="69" cy="22" r="9" fill="#f4c95d"/><circle cx="69" cy="73.5" r="7.6" fill="#fff"/>' +
          '</svg>' +
          '<div><div style="font-weight:800;color:#eef4fc;font-size:16px">한국AI휴먼전략연구원</div>' +
          '<div style="color:#7ad6ec;font-size:12.5px;letter-spacing:.06em;font-weight:700">KAHUGO</div></div>' +
        '</div>' +

        '<h1 style="font-size:22px;line-height:1.45;color:#eef4fc;margin:0 0 10px;word-break:keep-all">' +
          '이 파일은 <span style="color:#7ad6ec">인터넷 주소</span>로 열어야<br>정상 화면이 나옵니다</h1>' +
        '<p style="' + dim + '">지금처럼 파일 하나만 눌러서 열면, 디자인 파일과 기능 파일이 함께 열리지 않아 ' +
          '글자만 나열되어 보입니다. 아래 세 가지 중 하나로 여시면 즉시 정상 표시됩니다.</p>' +

        '<div style="margin-top:22px">' +
          '<div style="' + card + '">' +
            '<div style="color:#eef4fc;font-weight:700;font-size:15px"><span style="' + num + '">1</span>인터넷 주소로 접속 (가장 쉬움)</div>' +
            '<p style="' + dim + '">브라우저 주소창에 아래 주소를 입력하세요. 폰·태블릿·PC 모두 동일하게 동작합니다.</p>' +
            '<a href="https://kahugo.com" style="' + btn + '">https://kahugo.com 열기</a>' +
          '</div>' +

          '<div style="' + card + '">' +
            '<div style="color:#eef4fc;font-weight:700;font-size:15px"><span style="' + num + '">2</span>폰에서 파일로 보려면 “단일 파일” 사용</div>' +
            '<p style="' + dim + '">받으신 압축파일 안의 <b style="color:#f4c95d">kahugo-standalone.html</b> 을 대신 여세요. ' +
              '이 파일 하나에 디자인·기능이 모두 들어 있어 폴더 없이도 그대로 열립니다.</p>' +
          '</div>' +

          '<div style="' + card + '">' +
            '<div style="color:#eef4fc;font-weight:700;font-size:15px"><span style="' + num + '">3</span>PC 라면 폴더째 풀고 열기</div>' +
            '<p style="' + dim + '">압축을 푼 폴더를 통째로 둔 상태에서 그 안의 index.html 을 여세요. ' +
              'index.html 만 따로 옮기면 같은 증상이 다시 나타납니다.</p>' +
          '</div>' +
        '</div>' +

        '<div style="margin-top:6px">' +
          '<button type="button" id="kahugo-boot-retry" style="' + btn2 + '">다시 시도</button>' +
        '</div>' +

        '<p style="' + dim + ';margin-top:22px;border-top:1px solid #16304f;padding-top:14px">' +
          '진단: ' + reasons.join(' · ') + '<br>' +
          '문의 <a href="mailto:habibot@naver.com" style="color:#7ad6ec">habibot@naver.com</a><br>' +
          '© 2026 Korea AI Human Strategy Institute.</p>' +
      '</div>';

    box.hidden = false;
    box.style.display = 'block';
    H.className += ' kahugo-boot-fail';

    var rt = D.getElementById('kahugo-boot-retry');
    if (rt) rt.addEventListener('click', function () { location.reload(); });
  }

  function check() {
    var css = cssReady(), js = jsReady();
    if (css && js) return;
    var reasons = [];
    if (!css) reasons.push('디자인 파일(styles.css) 미연결');
    if (!js) reasons.push('기능 파일(app.js) 미연결');
    reasons.push('열기 방식 ' + location.protocol.replace(':', ''));
    paint(reasons);
  }

  /* 로컬 파일 스킴이면 렌더 직후, 그 외에는 로드 완료 후 한 번만 검사한다. */
  function schedule() { setTimeout(check, localScheme() ? 80 : 400); }
  if (D.readyState === 'complete') schedule();
  else window.addEventListener('load', schedule);
})();
</script>
