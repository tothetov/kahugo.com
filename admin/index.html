<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex,nofollow">
<title>KAHUGO 관리자 · 사이트 편집기</title>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#f4f7fc; --surface:#ffffff; --surface2:#eef3fb; --line:#dae3f0;
  --ink:#16263d; --dim:#5b6f8c;
  --brand:#2f7df6; --accent:#e9b858; --cyan:#2fd4e8;
  --ok:#1f9d6b; --warn:#d4761f; --danger:#d8453f;
  --r:14px; --r2:10px; --r3:8px;
  --shadow:0 6px 24px rgba(22,38,61,.10);
  --shadow2:0 14px 40px rgba(22,38,61,.18);
  --focus:0 0 0 3px rgba(47,125,246,.38);
}
html[data-theme="dark"]{
  --bg:#060f1e; --surface:#0b1a30; --surface2:#0f2140; --line:#1d3557;
  --ink:#eef4fc; --dim:#8fa4bf;
  --shadow:0 8px 28px rgba(0,0,0,.55);
  --shadow2:0 18px 46px rgba(0,0,0,.65);
  --focus:0 0 0 3px rgba(47,212,232,.42);
}
html,body{margin:0;padding:0;max-width:100%}
body{
  background:var(--bg); color:var(--ink);
  font:15px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  -webkit-text-size-adjust:100%; overflow-x:hidden; word-break:keep-all; overflow-wrap:anywhere;
}
body.noscroll{position:fixed;left:0;right:0;width:100%;overflow:hidden}
svg{width:1em;height:1em;flex:0 0 auto;display:inline-block;vertical-align:-.14em}
svg *{vector-effect:non-scaling-stroke}
img,svg,video{max-width:100%}
h1,h2,h3,h4,p,ul,ol,figure,blockquote{margin:0}
ul{padding-left:1.1em}
a{color:var(--brand)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ---------- 공통 컨트롤 ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  min-height:44px;min-width:44px;padding:9px 14px;
  border:1px solid var(--line);border-radius:var(--r2);
  background:var(--surface);color:var(--ink);
  font:600 14px/1.3 inherit;cursor:pointer;
  transition:background .15s,border-color .15s,transform .08s;
}
.btn:hover{border-color:var(--brand)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn .ic{font-size:17px}
.btn-primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn-primary:hover{filter:brightness(1.07)}
.btn-accent{background:var(--accent);border-color:var(--accent);color:#31240a}
.btn-danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn-ghost{background:transparent}
.btn-sm{min-height:44px;min-width:44px;padding:6px 10px;font-size:13px}
.btn-ico{min-height:44px;min-width:44px;padding:0;font-size:16px}
.btn-block{width:100%}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-width:0}
.row-end{justify-content:flex-end}
.grow{flex:1 1 160px;min-width:0}

label.fl{display:block;font-size:12.5px;font-weight:700;color:var(--dim);letter-spacing:.01em;margin:0 0 5px}
input[type=text],input[type=email],input[type=password],input[type=url],input[type=datetime-local],select,textarea{
  width:100%;max-width:100%;min-height:44px;padding:10px 12px;
  border:1px solid var(--line);border-radius:var(--r2);
  background:var(--surface);color:var(--ink);
  font:15px/1.5 inherit;
}
textarea{min-height:96px;resize:vertical;line-height:1.6}
select{appearance:none;-webkit-appearance:none;padding-right:34px;
  background-image:linear-gradient(45deg,transparent 49%,currentColor 50%,transparent 52%),linear-gradient(-45deg,transparent 49%,currentColor 50%,transparent 52%);
  background-size:7px 7px,7px 7px;background-position:calc(100% - 18px) 20px,calc(100% - 12px) 20px;background-repeat:no-repeat}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:var(--focus)}
input[type=color]{width:52px;height:44px;padding:3px;border:1px solid var(--line);border-radius:var(--r2);background:var(--surface);cursor:pointer}
.field{margin:0 0 13px;min-width:0}
.fields2{display:grid;grid-template-columns:1fr;gap:0 12px}
.hint{font-size:12px;color:var(--dim);margin-top:4px;line-height:1.5}

.chk{display:flex;align-items:center;gap:9px;min-height:44px;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;user-select:none}
.chk input{width:20px;height:20px;min-height:20px;accent-color:var(--brand);margin:0;flex:0 0 auto}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);min-width:0}
.card + .card{margin-top:12px}
.sect{margin:0 0 20px}
.sect-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.sect-h h2{font-size:16px;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:7px}
.sect-h h2 .ic{font-size:18px;color:var(--brand)}
.sect-h .sp{flex:1 1 auto}
.sub{font-size:12.5px;color:var(--dim);margin:-4px 0 12px;line-height:1.6}

.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid var(--line);background:var(--surface2);color:var(--dim)}
.badge.ok{color:var(--ok);border-color:rgba(31,157,107,.4);background:rgba(31,157,107,.10)}
.badge.warn{color:var(--warn);border-color:rgba(212,118,31,.4);background:rgba(212,118,31,.10)}
.badge.info{color:var(--brand);border-color:rgba(47,125,246,.4);background:rgba(47,125,246,.10)}
.badge.danger{color:var(--danger);border-color:rgba(216,69,63,.4);background:rgba(216,69,63,.10)}

/* ---------- 로그인 ---------- */
#login{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px 14px}
.login-box{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow2);padding:22px 18px}
.login-logo{display:flex;align-items:center;gap:10px;margin:0 0 4px}
.login-logo .mark{width:42px;height:42px;flex:0 0 auto;border-radius:12px;background:linear-gradient(135deg,var(--brand),var(--cyan));color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px}
.login-logo b{font-size:17px;font-weight:800;letter-spacing:-.02em;display:block}
.login-logo span{font-size:11.5px;color:var(--dim);font-weight:600}
.login-box h1{font-size:19px;font-weight:800;margin:14px 0 4px}
.pw-wrap{position:relative}
.pw-wrap input{padding-right:50px}
.pw-eye{position:absolute;right:4px;top:0;height:44px;width:44px;display:flex;align-items:center;justify-content:center;background:none;border:0;color:var(--dim);cursor:pointer;font-size:17px;border-radius:10px}
.lock-note{margin-top:10px;font-size:13px;font-weight:700;color:var(--danger)}
.env-note{display:flex;gap:8px;align-items:flex-start;font-size:12px;line-height:1.5;padding:9px 11px;border-radius:var(--r2);background:rgba(212,118,31,.10);border:1px solid rgba(212,118,31,.35);color:var(--warn);margin:0 0 14px;font-weight:600}
.env-note .ic{font-size:15px;margin-top:2px}

/* ---------- 앱 셸 ---------- */
#app[hidden]{display:none!important}
.topbar{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;align-items:center;gap:8px;padding:8px 12px;min-width:0}
.tb-brand{display:flex;align-items:center;gap:8px;min-width:0;flex:1 1 auto}
.tb-brand .mark{width:34px;height:34px;flex:0 0 auto;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--cyan));color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px}
.tb-brand b{font-size:14px;font-weight:800;display:block;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-brand small{font-size:11px;color:var(--dim);font-weight:600;display:block;line-height:1.2}
.tb-acts{display:flex;gap:6px;align-items:center;flex:0 0 auto}
.dirty-dot{width:8px;height:8px;border-radius:50%;background:var(--warn);display:none;flex:0 0 auto}
.is-dirty .dirty-dot{display:block}

.tabs{display:flex;gap:4px;overflow-x:auto;padding:0 8px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{display:inline-flex;align-items:center;gap:6px;flex:0 0 auto;min-height:44px;padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface2);color:var(--dim);font:700 13px/1.2 inherit;cursor:pointer;white-space:nowrap}
.tab .ic{font-size:16px}
.tab[aria-selected="true"]{background:var(--brand);border-color:var(--brand);color:#fff}

.wrap{padding:14px 12px 120px;max-width:1440px;margin:0 auto;min-width:0}
.layout{display:grid;grid-template-columns:1fr;gap:16px;min-width:0}
.editor{min-width:0}

/* 항목 카드 */
.item{border:1px solid var(--line);border-radius:var(--r2);background:var(--surface2);padding:12px;margin:0 0 10px;min-width:0}
.item.hid{opacity:.58}
.item-h{display:flex;align-items:center;gap:8px;margin:0 0 10px;min-width:0;flex-wrap:wrap}
.item-h .n{width:26px;height:26px;flex:0 0 auto;border-radius:8px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font:800 12px/1 inherit}
.item-h .t{font-weight:800;font-size:14px;flex:1 1 100px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-tools{display:flex;gap:5px;flex:0 0 auto}
.empty{padding:22px 12px;text-align:center;color:var(--dim);font-size:13.5px;border:1px dashed var(--line);border-radius:var(--r2)}

.icon-btn-sel{display:flex;align-items:center;gap:9px;width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:var(--r2);background:var(--surface);color:var(--ink);font:600 14px/1.3 inherit;cursor:pointer;text-align:left}
.icon-btn-sel .ic{font-size:19px;color:var(--brand)}
.icon-btn-sel .sp{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.icon-cell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:70px;padding:8px 4px;border:1px solid var(--line);border-radius:var(--r2);background:var(--surface2);color:var(--ink);cursor:pointer;font:600 10.5px/1.2 inherit}
.icon-cell .ic{font-size:21px;color:var(--brand)}
.icon-cell[aria-pressed="true"]{border-color:var(--brand);background:rgba(47,125,246,.13)}

.lvl-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:999px;font-size:11.5px;font-weight:800}
.lvl-info{background:rgba(47,125,246,.14);color:var(--brand)}
.lvl-warn{background:rgba(212,118,31,.15);color:var(--warn)}
.lvl-accent{background:rgba(233,184,88,.22);color:#8a6512}
html[data-theme="dark"] .lvl-accent{color:var(--accent)}

.kv{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13.5px;min-width:0}
.kv:last-child{border-bottom:0}
.kv b{font-weight:800;color:var(--brand);flex:0 0 auto}
.stack{display:grid;gap:8px}

.draft-bar{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;padding:12px;border-radius:var(--r2);border:1px solid rgba(212,118,31,.45);background:rgba(212,118,31,.10);margin:0 0 14px}
.draft-bar p{font-size:13px;font-weight:700;color:var(--warn);flex:1 1 190px;min-width:0}

/* ---------- 미리보기 ---------- */
.pvcol{min-width:0}
.pv-head{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:0 0 10px}
.pv-head h2{font-size:14px;font-weight:800;display:flex;align-items:center;gap:6px}
.pv-head h2 .ic{font-size:17px;color:var(--brand)}
.pv-w{display:flex;gap:4px;margin-left:auto}
.pv-w .btn{min-height:44px;min-width:52px;padding:4px 9px;font-size:12px}
.pv-w .btn[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.pv-stage{border:1px solid var(--line);border-radius:var(--r);background:var(--surface2);padding:10px;overflow:hidden;min-width:0}
.pv-scale{transform-origin:top left}
.pv-note{font-size:11.5px;color:var(--dim);margin-top:8px;text-align:center}

.pv{
  --pbrand:#2f7df6; --paccent:#e9b858;
  --pbg:#f4f7fc; --psurf:#ffffff; --pline:#dae3f0; --pink:#16263d; --pdim:#5b6f8c;
  background:var(--pbg);color:var(--pink);border-radius:12px;overflow:hidden;
  border:1px solid var(--pline);font-size:13px;line-height:1.65;
}
html[data-theme="dark"] .pv{--pbg:#060f1e;--psurf:#0b1a30;--pline:#1d3557;--pink:#eef4fc;--pdim:#8fa4bf}
.pv-hdr{background:var(--psurf);border-bottom:1px solid var(--pline)}
.pv-r1{display:flex;align-items:center;gap:8px;padding:9px 12px;min-width:0}
.pv-r1 .m{width:28px;height:28px;flex:0 0 auto;border-radius:9px;background:var(--pbrand);color:#fff;display:flex;align-items:center;justify-content:center;font:800 11px/1 inherit}
.pv-r1 .tt{min-width:0;flex:1 1 auto}
.pv-r1 .tt b{display:block;font-size:12.5px;font-weight:800;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv-r1 .tt span{display:block;font-size:10px;color:var(--pdim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv-r1 .ics{display:flex;gap:8px;color:var(--pdim);font-size:15px;flex:0 0 auto}
.pv-r2{display:flex;gap:3px;padding:0 8px 8px;overflow:hidden}
.pv-nv{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1 1 0;min-width:0;padding:6px 2px;border-radius:9px;background:var(--pbg);font-size:9.5px;font-weight:700;color:var(--pdim);text-align:center}
.pv-nv .ic{font-size:16px}
.pv-nv b{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.pv-nv.on{background:var(--pbrand);color:#fff}
.pv-nv.acc{background:var(--paccent);color:#31240a}
.pv-body{padding:12px}
.pv-hero{padding:16px 14px;border-radius:12px;background:linear-gradient(150deg,var(--pbrand),var(--psurf) 78%);color:#fff;margin:0 0 12px}
html[data-theme="dark"] .pv-hero{background:linear-gradient(150deg,var(--pbrand),#0b1a30 82%)}
.pv-hero i{display:inline-block;font-style:normal;font-size:9.5px;font-weight:800;letter-spacing:.08em;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.22);margin:0 0 8px}
.pv-hero h3{font-size:19px;line-height:1.32;font-weight:800;letter-spacing:-.02em}
.pv-hero h3 em{font-style:normal;color:var(--paccent);display:block}
.pv-hero p{font-size:11.5px;opacity:.9;margin-top:7px;line-height:1.6}
.pv-nt{display:flex;gap:8px;padding:9px 11px;border-radius:10px;margin:0 0 8px;font-size:11.5px;line-height:1.5;border:1px solid}
.pv-nt .ic{font-size:14px;flex:0 0 auto;margin-top:1px}
.pv-nt b{display:block;font-size:12px;font-weight:800}
.pv-nt.info{background:rgba(47,125,246,.12);border-color:rgba(47,125,246,.4);color:var(--pbrand)}
.pv-nt.warn{background:rgba(212,118,31,.12);border-color:rgba(212,118,31,.4);color:#b5651a}
html[data-theme="dark"] .pv-nt.warn{color:#e59b4c}
.pv-nt.accent{background:rgba(233,184,88,.18);border-color:rgba(233,184,88,.5);color:#8a6512}
html[data-theme="dark"] .pv-nt.accent{color:var(--paccent)}
.pv-pg{background:var(--psurf);border:1px solid var(--pline);border-radius:12px;padding:13px;margin-top:10px}
.pv-pg > h4{font-size:16px;font-weight:800;letter-spacing:-.01em}
.pv-pg > .lead{font-size:12px;color:var(--pdim);margin-top:5px;line-height:1.6}
.pv-bk{margin-top:13px;padding-top:12px;border-top:1px dashed var(--pline)}
.pv-bk h5{font-size:13px;font-weight:800;margin:0 0 5px;display:flex;align-items:center;gap:5px}
.pv-bk h5::before{content:"";width:3px;height:13px;border-radius:2px;background:var(--pbrand);flex:0 0 auto}
.pv-bk p{font-size:11.8px;color:var(--pdim);line-height:1.65}
.pv-bk ul{margin:5px 0 0;padding-left:16px;font-size:11.8px;color:var(--pdim)}
.pv-bk ul li{margin:3px 0}
.pv-cards{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px}
.pv-cd{border:1px solid var(--pline);border-radius:9px;padding:9px;background:var(--pbg);min-width:0}
.pv-cd b{display:block;font-size:11.5px;font-weight:800;margin:0 0 3px}
.pv-cd span{font-size:10.5px;color:var(--pdim);line-height:1.5}
.pv-q{border-left:3px solid var(--paccent);padding:4px 0 4px 11px;font-size:12px;font-style:italic;color:var(--pink)}
.pv-q cite{display:block;font-style:normal;font-size:10.5px;color:var(--pdim);margin-top:5px}
.pv-cta{border-radius:11px;padding:13px;background:var(--pbrand);color:#fff;text-align:center;margin-top:7px}
.pv-cta b{display:block;font-size:13px;font-weight:800}
.pv-cta span{display:block;font-size:11px;opacity:.92;margin:5px 0 9px;line-height:1.55}
.pv-cta i{display:inline-block;font-style:normal;background:var(--paccent);color:#31240a;font-size:11.5px;font-weight:800;padding:8px 16px;border-radius:999px}
.pv-ft{padding:12px;text-align:center;font-size:10px;color:var(--pdim);border-top:1px solid var(--pline);background:var(--psurf)}
.pv-tabs{display:flex;background:var(--psurf);border-top:1px solid var(--pline);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.pv-tb{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:9.5px;font-weight:700;color:var(--pdim);padding:4px 2px}
.pv-tb .ic{font-size:18px}
.pv-tb b{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.pv-tb.on{color:var(--pbrand)}
.pv-tb.acc{color:var(--paccent)}

/* 모바일 미리보기 시트 */
.pv-fab{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:55;min-height:52px;min-width:52px;border-radius:999px;box-shadow:var(--shadow2);font-size:18px}
.pvcol{position:fixed;left:0;right:0;bottom:0;z-index:60;max-height:82dvh;overflow:auto;-webkit-overflow-scrolling:touch;background:var(--surface);border-top:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:var(--shadow2);padding:12px 12px calc(16px + env(safe-area-inset-bottom));transform:translateY(102%);transition:transform .24s ease;visibility:hidden}
.pvcol.open{transform:translateY(0);visibility:visible}
.pv-grab{width:42px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 10px}

/* ---------- 토스트 / 모달 ---------- */
#toasts{position:fixed;left:10px;right:10px;top:10px;z-index:90;display:flex;flex-direction:column;gap:8px;pointer-events:none;align-items:center}
.toast{pointer-events:auto;display:flex;align-items:flex-start;gap:9px;width:100%;max-width:420px;padding:11px 12px;border-radius:var(--r2);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow2);font-size:13.5px;font-weight:700;line-height:1.5}
.toast .ic{font-size:17px;flex:0 0 auto;margin-top:1px}
.toast .m{flex:1 1 auto;min-width:0}
.toast.ok{border-color:rgba(31,157,107,.5)}.toast.ok .ic{color:var(--ok)}
.toast.warn{border-color:rgba(212,118,31,.5)}.toast.warn .ic{color:var(--warn)}
.toast.err{border-color:rgba(216,69,63,.5)}.toast.err .ic{color:var(--danger)}
.toast button{background:none;border:0;color:var(--dim);cursor:pointer;font-size:15px;padding:0;min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;border-radius:8px}

#modal[hidden]{display:none!important}
#modal{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center}
.mask{position:absolute;inset:0;background:rgba(8,18,34,.58);backdrop-filter:blur(2px)}

function clone(o){ return JSON.parse(JSON.stringify(o)); }
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
  });
}
function $(sel, root){ return (root || document).querySelector(sel); }
function $$(sel, root){ return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
function getPath(obj, path){
  var parts = String(path).split("."), cur = obj, i;
  for(i = 0; i < parts.length; i++){
    if(cur == null) return undefined;
    cur = cur[parts[i]];
  }
  return cur;
}
function setPath(obj, path, val){
  var parts = String(path).split("."), cur = obj, i;
  for(i = 0; i < parts.length - 1; i++){
    if(cur[parts[i]] == null || typeof cur[parts[i]] !== "object") cur[parts[i]] = {};
    cur = cur[parts[i]];
  }
  cur[parts[parts.length - 1]] = val;
}
function hexOk(v){ return /^#[0-9a-fA-F]{6}$/.test(String(v || "").trim()); }
function lines(arr){ return (arr || []).join("\n"); }
function unlines(s){ return String(s || "").split(/\r?\n/).map(function(x){ return x.trim(); }).filter(function(x){ return x.length > 0; }); }
function move(arr, i, dir){
  var j = i + dir;
  if(j < 0 || j >= arr.length) return false;
  var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  return true;
}
function nowIso(){ return new Date().toISOString(); }
function fmtTime(iso){
  if(!iso) return "-";
  try{
    var d = new Date(iso);
    if(isNaN(d.getTime())) return "-";
    var p = function(n){ return ("0" + n).slice(-2); };
    return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
  }catch(e){ return "-"; }
}

var TOAST_ICON = { ok:"check", warn:"bell", err:"x", info:"spark" };
function toast(msg, kind){
  var k = kind || "ok";
  var host = $("#toasts");
  if(!host) return;
  var el = document.createElement("div");
  el.className = "toast " + (k === "err" ? "err" : k === "warn" ? "warn" : "ok");
  el.innerHTML = svg(TOAST_ICON[k] || "check") + '<span class="m">' + esc(msg) + '</span>' +
                 '<button type="button" data-act="toast-close" aria-label="알림 닫기">' + svg("x") + '</button>';
  host.appendChild(el);
  var kill = function(){ if(el && el.parentNode) el.parentNode.removeChild(el); };
  setTimeout(kill, k === "err" ? 5200 : 3200);
}

var scrollLocked = false, scrollY = 0, lastFocus = null;
var MODAL = { onOk:null, onCancel:null };
function lockScroll(){
  if(scrollLocked) return;
  scrollLocked = true;
  scrollY = window.pageYOffset || document.documentElement.scrollTop || 0;
  document.body.style.top = (-scrollY) + "px";
  document.body.classList.add("noscroll");
}
function unlockScroll(){
  if(!scrollLocked) return;
  scrollLocked = false;
  document.body.classList.remove("noscroll");
  document.body.style.top = "";
  window.scrollTo(0, scrollY);
}
function openModal(o){
  var m = $("#modal");
  if(!m) return;
  lastFocus = document.activeElement;
  MODAL.onOk = o.onOk || null;
  MODAL.onCancel = o.onCancel || null;
  $("#modalTitle").textContent = o.title || "";
  $("#modalMsg").textContent = o.msg || "";
  $("#modalMsg").hidden = !o.msg;
  $("#modalBody").innerHTML = o.body || "";
  var acts = o.acts || [{ label:"확인", act:"modal-ok", cls:"btn-primary" }];
  $("#modalActs").innerHTML = acts.map(function(a){
    return '<button type="button" class="btn ' + (a.cls || "") + '" data-act="' + a.act + '">' + esc(a.label) + "</button>";
  }).join("");
  $("#modalActs").hidden = acts.length === 0;
  $(".sheet .x").innerHTML = svg("x");
  m.hidden = false;
  lockScroll();
  var f = m.querySelector("input,select,textarea,button.btn");
  if(f){ try{ f.focus(); }catch(e){} }
}
function closeModal(){
  var m = $("#modal");
  MODAL.onOk = null; MODAL.onCancel = null;
  if(m){ m.hidden = true; $("#modalBody").innerHTML = ""; $("#modalActs").innerHTML = ""; }
  unlockScroll();
  if(lastFocus && lastFocus.focus){ try{ lastFocus.focus(); }catch(e){} }
  lastFocus = null;
}
function confirmBox(title, msg, okLabel, onOk, danger){
  openModal({
    title: title, msg: msg, onOk: onOk,
    acts: [
      { label:"취소", act:"modal-cancel", cls:"btn-ghost" },
      { label: okLabel || "확인", act:"modal-ok", cls: danger ? "btn-danger" : "btn-primary" }
    ]
  });
}

function applyTheme(t){
  document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light");
  store.set(K_THEME, t === "dark" ? "dark" : "light");
  var b = $("#btnTheme");
  if(b){ b.innerHTML = svg(t === "dark" ? "sun" : "moon"); }
}

/* =========================================================
   9) 변경 이력 (Undo / Redo)
   ========================================================= */
function pushUndo(beforeStr){
  S.undo.push(beforeStr);
  if(S.undo.length > UNDO_MAX) S.undo.shift();
  S.redo.length = 0;
  S.dirty = true;
  updateChrome();
}
function mutate(fn){
  var before = JSON.stringify(S.cfg);
  try{ fn(S.cfg); }catch(e){ toast("작업 중 오류가 발생했습니다.", "err"); return; }
  var after = JSON.stringify(S.cfg);
  if(before === after){ render(); return; }
  pushUndo(before);
  render();
}
function doUndo(){
  if(!S.undo.length){ toast("되돌릴 변경이 없습니다.", "warn"); return; }
  S.redo.push(JSON.stringify(S.cfg));
  S.cfg = JSON.parse(S.undo.pop());
  S.dirty = true;
  render();
  toast("되돌렸습니다. (남은 단계 " + S.undo.length + ")", "ok");
}
function doRedo(){
  if(!S.redo.length){ toast("다시 실행할 변경이 없습니다.", "warn"); return; }
  S.undo.push(JSON.stringify(S.cfg));
  S.cfg = JSON.parse(S.redo.pop());
  S.dirty = true;
  render();
  toast("다시 실행했습니다.", "ok");
}
function updateChrome(){
  var u = $("#btnUndo"), r = $("#btnRedo"), d = document.body;
  if(u){ u.innerHTML = svg("up"); u.disabled = S.undo.length === 0; }
  if(r){ r.innerHTML = svg("down"); r.disabled = S.redo.length === 0; }
  if(d){ d.classList.toggle("is-dirty", !!S.dirty); }
  var t = $("#tbTitle");
  if(t) t.textContent = (S.cfg.site.abbr || "KAHUGO") + " 관리자";
}

   10) 폼 조각 헬퍼
   ========================================================= */
var fid = 0;
function nid(){ fid++; return "f" + fid; }
function fInput(label, path, opt){
  opt = opt || {};
  var id = nid(), v = getPath(S.cfg, path);
  return '<div class="field"><label class="fl" for="' + id + '">' + esc(label) + "</label>" +
    '<input type="' + (opt.type || "text") + '" id="' + id + '" data-bind="' + path + '" value="' + esc(v == null ? "" : v) + '" placeholder="' + esc(opt.ph || "") + '"' +
    (opt.max ? ' maxlength="' + opt.max + '"' : "") + ">" +
    (opt.hint ? '<p class="hint">' + esc(opt.hint) + "</p>" : "") + "</div>";
}
function fArea(label, path, opt){
  opt = opt || {};
  var id = nid(), v = getPath(S.cfg, path);
  return '<div class="field"><label class="fl" for="' + id + '">' + esc(label) + "</label>" +
    '<textarea id="' + id + '" data-bind="' + path + '"' + (opt.mode ? ' data-mode="' + opt.mode + '"' : "") +
    ' rows="' + (opt.rows || 4) + '" placeholder="' + esc(opt.ph || "") + '">' + esc(opt.mode === "lines" ? lines(v) : (v == null ? "" : v)) + "</textarea>" +
    (opt.hint ? '<p class="hint">' + esc(opt.hint) + "</p>" : "") + "</div>";
}
function fSelect(label, path, options, opt){
  opt = opt || {};
  var id = nid(), v = String(getPath(S.cfg, path) == null ? "" : getPath(S.cfg, path));
  return '<div class="field"><label class="fl" for="' + id + '">' + esc(label) + "</label>" +
    '<select id="' + id + '" data-bind="' + path + '">' +
    options.map(function(o){
      return '<option value="' + esc(o[0]) + '"' + (String(o[0]) === v ? " selected" : "") + ">" + esc(o[1]) + "</option>";
    }).join("") + "</select>" +
    (opt.hint ? '<p class="hint">' + esc(opt.hint) + "</p>" : "") + "</div>";
}
function fColor(label, path){
  var id = nid(), id2 = nid(), v = getPath(S.cfg, path);
  if(!hexOk(v)) v = "#2f7df6";
  return '<div class="field"><label class="fl" for="' + id2 + '">' + esc(label) + "</label>" +
    '<div class="row"><input type="color" id="' + id + '" data-bind="' + path + '" value="' + esc(v) + '" aria-label="' + esc(label) + ' 색상 선택기">' +
    '<input type="text" class="grow" id="' + id2 + '" data-bind="' + path + '" value="' + esc(v) + '" placeholder="#2f7df6" spellcheck="false" inputmode="text"></div>' +
    '<p class="hint">HEX 6자리(예: #2f7df6)를 직접 입력하거나 색상 상자를 눌러 고르세요.</p></div>';
}
function fCheck(label, path){
  var id = nid(), v = !!getPath(S.cfg, path);
  return '<label class="chk" for="' + id + '"><input type="checkbox" id="' + id + '" data-bind="' + path + '"' + (v ? " checked" : "") + "> " + esc(label) + "</label>";
}
function toolBtn(act, idx, icon, label, extra){
  return '<button type="button" class="btn btn-ico btn-sm" data-act="' + act + '" data-i="' + idx + '"' + (extra || "") + ' aria-label="' + esc(label) + '" title="' + esc(label) + '">' + svg(icon) + "</button>";
}

/* ---------- 탭 5 : 저장 / 배포 / 설정 ---------- */
function listDiff(a, b){
  var am = {}, bm = {}, add = 0, del = 0, mod = 0, ord = 0;
  (a || []).forEach(function(x){ am[x.id] = x; });
  (b || []).forEach(function(x){ bm[x.id] = x; });
  (b || []).forEach(function(x){
    if(!am[x.id]) add++;
    else if(JSON.stringify(am[x.id]) !== JSON.stringify(x)) mod++;
  });
  (a || []).forEach(function(x){ if(!bm[x.id]) del++; });
  var ai = (a || []).filter(function(x){ return bm[x.id]; }).map(function(x){ return x.id; }).join(",");
  var bi = (b || []).filter(function(x){ return am[x.id]; }).map(function(x){ return x.id; }).join(",");
  if(ai !== bi) ord = 1;
  return { add:add, del:del, mod:mod, ord:ord, any:(add + del + mod + ord) > 0 };
}
function diffText(d, unit){
  var p = [];
  if(d.add) p.push("추가 " + d.add);
  if(d.mod) p.push("수정 " + d.mod);
  if(d.del) p.push("삭제 " + d.del);
  if(d.ord) p.push("순서 변경");
  return p.length ? p.join(" · ") + (unit ? "" : "") : "변경 없음";
}
function buildSummary(){
  var base = S.base ? JSON.parse(S.base) : defaultConfig();
  var cur = S.cfg, out = [], k;
  var sf = 0;
  for(k in cur.site){
    if(Object.prototype.hasOwnProperty.call(cur.site, k) && String(cur.site[k]) !== String((base.site || {})[k])) sf++;
  }
  out.push(["사이트 기본 정보", sf ? sf + "개 항목 변경" : "변경 없음", sf > 0]);
  var dn = listDiff(base.nav, cur.nav);
  out.push(["상단 대메뉴", diffText(dn), dn.any]);
  var db = listDiff(base.bottomNav, cur.bottomNav);
  out.push(["하단 탭바", diffText(db), db.any]);

  var pgChanged = 0, bkAdd = 0, bkMod = 0, bkDel = 0;
  ROUTE_IDS.forEach(function(rid){
    var a = (base.pages || {})[rid] || { title:"", lead:"", hidden:false, blocks:[] };
    var b = (cur.pages || {})[rid] || { title:"", lead:"", hidden:false, blocks:[] };
    var meta = (a.title !== b.title) || (a.lead !== b.lead) || (!!a.hidden !== !!b.hidden);
    var d = listDiff(a.blocks, b.blocks);
    bkAdd += d.add; bkMod += d.mod + d.ord; bkDel += d.del;
    if(meta || d.any) pgChanged++;
  });
  out.push(["페이지", pgChanged ? pgChanged + "개 페이지 변경" : "변경 없음", pgChanged > 0]);
  out.push(["콘텐츠 블록", (bkAdd + bkMod + bkDel) ? diffText({ add:bkAdd, mod:bkMod, del:bkDel, ord:0 }) : "변경 없음", (bkAdd + bkMod + bkDel) > 0]);
  var dnt = listDiff(base.notices, cur.notices);
  out.push(["공지 배너", diffText(dnt), dnt.any]);
  var nf = 0;
  for(k in cur.news){
    if(Object.prototype.hasOwnProperty.call(cur.news, k) && String(cur.news[k]) !== String((base.news || {})[k])) nf++;
  }
  out.push(["뉴스레터 초안", nf ? nf + "개 항목 변경" : "변경 없음", nf > 0]);
  return out;
}

  function navItem(x, isNav, i){

  c.bottomNav = (Array.isArray(raw.bottomNav) ? raw.bottomNav : d.bottomNav).slice(0, 4).map(function(x, i){
    var o = navItem(x, false, i); delete o.full; return o;
  });

  c.pages = {};
  ROUTE_IDS.forEach(function(rid){

          items: Array.isArray(b.items) ? b.items.map(function(x){ return String(x); }) : [],
          hidden: !!b.hidden
        };
      })
    };
  });
  c.notices = (Array.isArray(raw.notices) ? raw.notices : d.notices).map(function(n){
    n = n || {};
    return {
      id: String(n.id || uid("nt")),
      level: (n.level === "warn" || n.level === "accent") ? n.level : "info",
      title: String(n.title == null ? "" : n.title),
      body: String(n.body == null ? "" : n.body),
      active: !!n.active
    };
  });
  c.news = {};
  Object.keys(d.news).forEach(function(k){
    c.news[k] = (raw.news && typeof raw.news[k] === "string") ? raw.news[k] : d.news[k];
  });
  c.removed = {
    nav: Array.isArray(raw.removed && raw.removed.nav) ? raw.removed.nav : [],
    bottomNav: Array.isArray(raw.removed && raw.removed.bottomNav) ? raw.removed.bottomNav : [],
    blocks: Array.isArray(raw.removed && raw.removed.blocks) ? raw.removed.blocks : []
  };
  return c;
}
function saveLocal(silent){

function loadLocal(){
  var raw = store.get(K_CFG);

function autosave(){

function downloadJson(){
  var txt = JSON.stringify(S.cfg, null, 2);
  try{
    var blob = new Blob([txt], { type:"application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = "site-config.json";
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); if(a.parentNode) a.parentNode.removeChild(a); }, 400);

  }catch(e){
    openModal({

      body:'<textarea rows="10" readonly aria-label="설정 JSON">' + esc(txt) + "</textarea>",
      acts:[{ label:"닫기", act:"modal-cancel", cls:"btn-primary" }]

/* =========================================================
   15) 백엔드 연동
   ========================================================= */
function apiCheck(quiet){
  S.apiState = "checking";
  if(S.tab === "deploy") renderPanel();
  var done = function(state){
    S.apiState = state;
    if(S.tab === "deploy") renderPanel();
    if(!quiet){
      if(state === "live") toast("실시간 편집 서버에 연결되었습니다. (B안)", "ok");
      else toast("정적 배포 모드입니다. JSON 내려받기로 배포하세요. (A안)", "warn");
    }
  };
  var ctrl = null, timer = null;
  try{ if(typeof AbortController !== "undefined") ctrl = new AbortController(); }catch(e){ ctrl = null; }
  var proto = "";
  try{ proto = window.location.protocol; }catch(e){ proto = ""; }
  if(proto !== "http:" && proto !== "https:"){ done("static"); return; }
  try{
    if(typeof fetch !== "function"){ done("static"); return; }
    timer = setTimeout(function(){ try{ if(ctrl) ctrl.abort(); }catch(e){} }, 4000);
    fetch("/api/config", { method:"GET", headers:{ "accept":"application/json" }, signal: ctrl ? ctrl.signal : undefined })
      .then(function(r){ if(!r || !r.ok) throw new Error("bad"); return r.json(); })
      .then(function(){ clearTimeout(timer); done("live"); })
      .catch(function(){ clearTimeout(timer); done("static"); });
  }catch(e){ if(timer) clearTimeout(timer); done("static"); }
}
function apiPush(){
  if(S.apiState !== "live"){ toast("서버가 연결되지 않아 전송할 수 없습니다.", "warn"); return; }
  var tk = store.get(K_TOKEN) || "";
  try{
    fetch("/api/config", {
      method:"PUT",
      headers:{ "content-type":"application/json", "x-kahugo-token": tk },
      body: JSON.stringify(S.cfg)
    }).then(function(r){
      if(r && r.ok){ toast("서버에 반영했습니다.", "ok"); saveLocal(true); }
      else toast("서버가 요청을 거부했습니다. 토큰을 확인하세요.", "err");
    }).catch(function(){ toast("서버 전송에 실패했습니다.", "err"); });
  }catch(e){ toast("서버 전송에 실패했습니다.", "err"); }
}

/* =========================================================
   16) 로그인 / 잠금
   ========================================================= */
function lockState(){
  try{
    var o = JSON.parse(store.get(K_LOCK) || "{}");
    return { fails: Number(o.fails) || 0, until: Number(o.until) || 0 };
  }catch(e){ return { fails:0, until:0 }; }
}
function setLockState(o){ store.set(K_LOCK, JSON.stringify(o)); }
var lockTimer = null;
function paintLock(){
  var st = lockState(), el = $("#lockNote"), left = Math.ceil((st.until - Date.now()) / 1000);
  if(!el) return;
  if(left > 0){
    el.hidden = false;
    el.textContent = "5회 연속 실패로 잠겼습니다. " + left + "초 후 다시 시도하세요.";
    var b = $("#loginForm button[data-act='login']"); if(b) b.disabled = true;
    if(!lockTimer) lockTimer = setInterval(paintLock, 1000);
  } else {
    if(lockTimer){ clearInterval(lockTimer); lockTimer = null; }
    var bb = $("#loginForm button[data-act='login']"); if(bb) bb.disabled = false;
    if(st.fails > 0 && st.fails < 5){
      el.hidden = false;
      el.textContent = "비밀번호가 올바르지 않습니다. (" + st.fails + "/5회 실패)";
    } else { el.hidden = true; el.textContent = ""; }
  }
}
function sessionToken(hash){ return sha256Fallback("sess::" + hash); }
function grantSession(hash, keep){
  var tk = sessionToken(hash);
  if(keep){ store.set(K_SESS, tk); store.del(K_SESS, "session"); }
  else { store.set(K_SESS, tk, "session"); store.del(K_SESS); }
}
function enterApp(){
  S.authed = true;
  var lg = $("#login"), ap = $("#app");
  if(lg) lg.hidden = true;
  if(lg) lg.style.display = "none";
  if(ap) ap.hidden = false;
  bootData();
  render();
  renderBanners();
  apiCheck(true);
}
function tryLogin(pw, keep){
  var st = lockState();
  if(st.until > Date.now()){ paintLock(); return; }
  hashHex(pw).then(function(h){
    var stored = store.get(K_PW);
    if(stored && h === stored){
      setLockState({ fails:0, until:0 });
      grantSession(h, keep);
      paintLock();
      enterApp();
      toast("관리자 모드에 진입했습니다.", "ok");
    } else {
      var s2 = lockState();
      s2.fails = (s2.fails || 0) + 1;
      if(s2.fails >= 5){ s2.until = Date.now() + 60000; s2.fails = 5; }
      setLockState(s2);
      paintLock();
      var inp = $("#pwIn"); if(inp){ inp.value = ""; inp.focus(); }
    }
  });
}

/* =========================================================
   17) 데이터 부팅
   ========================================================= */
var booted = false;
function bootData(){
  if(booted) return;
  booted = true;
  var loaded = loadLocal();
  if(loaded) S.cfg = loaded;
  S.base = JSON.stringify(S.cfg);
  S.dirty = false;
  var draftRaw = store.get(K_DRAFT);
  if(draftRaw){
    try{
      var d = JSON.parse(draftRaw);
      if(d && d.cfg && JSON.stringify(normalizeCfg(d.cfg)) !== S.base) S.draftFound = d;
      else store.del(K_DRAFT);
    }catch(e){ store.del(K_DRAFT); }
  }
  setInterval(autosave, 30000);
}

    if(S.apiState === "live"){
      var tk = store.get(K_TOKEN) || "";
      fetch("/api/access/list", { headers: { "x-kahugo-token": tk } })
        .then(function(r){ return r && r.ok ? r.json() : null; })
        .then(function(j){
          if(j && j.list){ saveAccessQueue(j.list); renderPanel(); toast("서버 승인 대기열을 동기화했습니다.", "ok"); }
          else { renderPanel(); toast("승인 대기열을 새로고침했습니다.", "ok"); }
        }).catch(function(){ renderPanel(); toast("승인 대기열을 새로고침했습니다.", "ok"); });
    } else { renderPanel(); toast("승인 대기열을 새로고침했습니다.", "ok"); }
  },
  "access-approve": function(el){
    var u = el.getAttribute("data-uid"), q = loadAccessQueue();
    q.forEach(function(r){ if(r.uid === u){ r.status = "approved"; r.decidedAt = new Date().toISOString(); } });
    saveAccessQueue(q); renderPanel();
    syncAccessDecision(u, "approve");
    toast("승인했습니다. 신청자 기기에서 새로고침하면 반영됩니다.", "ok");
  },
  "access-deny": function(el){
    var u = el.getAttribute("data-uid"), q = loadAccessQueue();
    q.forEach(function(r){ if(r.uid === u){ r.status = "denied"; r.decidedAt = new Date().toISOString(); } });
    saveAccessQueue(q); renderPanel();
    syncAccessDecision(u, "deny");
    toast("보류 처리했습니다.", "warn");
  },
  "access-reset": function(el){
    var u = el.getAttribute("data-uid"), q = loadAccessQueue();
    q.forEach(function(r){ if(r.uid === u){ r.status = "requested"; } });
    saveAccessQueue(q); renderPanel();
    toast("대기 상태로 되돌렸습니다.", "ok");
  },
  "pw-change": function(){
    var cur = $("#pwCur"), n1 = $("#pwNew1"), n2 = $("#pwNew2");
    if(!cur || !n1 || !n2) return;
    var cv = cur.value, a = n1.value, b = n2.value;
    if(!cv){ toast("현재 비밀번호를 입력하세요.", "warn"); cur.focus(); return; }
    if(a.length < 6){ toast("새 비밀번호는 6자 이상이어야 합니다.", "warn"); n1.focus(); return; }
    if(a !== b){ toast("새 비밀번호 확인이 일치하지 않습니다.", "err"); n2.focus(); return; }
    hashHex(cv).then(function(h){
      if(h !== store.get(K_PW)){ toast("현재 비밀번호가 올바르지 않습니다.", "err"); cur.value = ""; cur.focus(); return; }
      return hashHex(a).then(function(nh){
        store.set(K_PW, nh);
        grantSession(nh, !!store.get(K_SESS));
        cur.value = ""; n1.value = ""; n2.value = "";
        toast("비밀번호를 변경했습니다. 다음 로그인부터 적용됩니다.", "ok");
      });
    });
  },

  /* ----- 배너 / 모달 ----- */
  "draft-restore": function(){
    var d = S.draftFound;
    if(!d){ return; }
    mutate(function(){ S.cfg = normalizeCfg(d.cfg); });
    S.draftFound = null;
    store.del(K_DRAFT);
    renderBanners();
    toast("임시저장본을 복구했습니다.", "ok");
  },
  "draft-dismiss": function(){
    S.draftFound = null;
    store.del(K_DRAFT);
    renderBanners();
    toast("임시저장본을 삭제했습니다.", "warn");
  },
  "modal-ok": function(){
    var fn = MODAL.onOk;
    if(typeof fn === "function") fn();
    else closeModal();
  },
  "modal-cancel": function(){
    var fn = MODAL.onCancel;
    closeModal();
    if(typeof fn === "function") fn();
  }
};

/* =========================================================
   19) 위임 리스너 (문서 단 하나)
   ========================================================= */
function actOf(node){
  var el = node;
  while(el && el !== document){
    if(el.getAttribute && el.getAttribute("data-act")) return el;
    el = el.parentNode;
  }
  return null;
}
document.addEventListener("click", function(e){
  var el = actOf(e.target);
  if(!el) return;
  var a = el.getAttribute("data-act");
  if(el.tagName === "INPUT" || el.tagName === "TEXTAREA" || el.tagName === "SELECT") return;
  if(!ACT[a]) return;
  if(el.disabled) return;
  e.preventDefault();
  ACT[a](el, e);
});
document.addEventListener("submit", function(e){
  if(e.target && e.target.id === "loginForm"){
    e.preventDefault();
    ACT.login();
  }
});
function applyBind(el){
  var path = el.getAttribute("data-bind");
  if(!path) return false;
  var val;
  if(el.type === "checkbox") val = !!el.checked;
  else if(el.getAttribute("data-mode") === "lines") val = unlines(el.value);
  else val = el.value;
  setPath(S.cfg, path, val);
  return true;
}
document.addEventListener("input", function(e){
  var el = e.target;
  if(!el || !el.getAttribute) return;
  if(el.getAttribute("data-act") === "token"){ ACT.token(el); return; }
  if(!el.getAttribute("data-bind")) return;
  if(el.tagName === "SELECT" || el.type === "checkbox") return;
  applyBind(el);
  var path = el.getAttribute("data-bind");
  $$('[data-bind="' + path + '"]').forEach(function(o){
    if(o !== el && o.value !== el.value && o.type !== "checkbox" && o.tagName !== "TEXTAREA"){
      if(o.type !== "color" || hexOk(el.value)) o.value = el.value;
    }
  });
  S.dirty = true;
  updateChrome();
  renderPreview();
});
document.addEventListener("change", function(e){
  var el = e.target;
  if(!el || !el.getAttribute) return;
  var a = el.getAttribute("data-act");
  if(a && ACT[a] && (el.tagName === "SELECT" || el.type === "checkbox")){ ACT[a](el, e); return; }
  if(!el.getAttribute("data-bind")) return;
  if(el.tagName === "SELECT" || el.type === "checkbox"){
    mutate(function(){ applyBind(el); });
  }
});
document.addEventListener("focusin", function(e){
  var el = e.target;
  if(el && el.getAttribute && el.getAttribute("data-bind") && el.type !== "checkbox" && el.tagName !== "SELECT"){
    S.snap = JSON.stringify(S.cfg);
  }
});
document.addEventListener("focusout", function(e){
  var el = e.target;
  if(el && el.getAttribute && el.getAttribute("data-bind") && S.snap){
    var now = JSON.stringify(S.cfg);
    if(now !== S.snap) pushUndo(S.snap);
    S.snap = null;
    if(S.tab === "menu" || S.tab === "notice") renderPanel();
  }
});
document.addEventListener("keydown", function(e){
  var k = (e.key || "").toLowerCase();
  if(k === "escape"){
    var m = $("#modal");
    if(m && !m.hidden){ e.preventDefault(); ACT["modal-cancel"](); return; }
    var c = $("#pvCol");
    if(c && c.classList.contains("open")){ c.classList.remove("open"); return; }
  }
  if((e.ctrlKey || e.metaKey) && k === "z"){
    var t = e.target;
    var editable = t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable);
    if(editable) return;
    if(!S.authed) return;
    e.preventDefault();
    if(e.shiftKey) doRedo(); else doUndo();
  }
  if((e.ctrlKey || e.metaKey) && k === "y" && S.authed){ e.preventDefault(); doRedo(); }
});
window.addEventListener("resize", function(){ if(S.authed) fitPreview(); });
window.addEventListener("beforeunload", function(e){
  if(!S.dirty) return;
  autosave();
  e.preventDefault();
  e.returnValue = "저장하지 않은 변경 사항이 있습니다.";
  return e.returnValue;
});
var fileEl = $("#fileIn");
if(fileEl){
  fileEl.addEventListener("change", function(){
    var f = fileEl.files && fileEl.files[0];
    if(!f) return;
    var rd = new FileReader();
    rd.onload = function(){
      try{
        var parsed = JSON.parse(String(rd.result));
        var next = normalizeCfg(parsed);
        mutate(function(){ S.cfg = next; });
        S.route = "home";
        render();
        toast("JSON 파일에서 설정을 복원했습니다.", "ok");
      }catch(err){
        toast("JSON 파일을 읽을 수 없습니다. 형식을 확인하세요.", "err");
      }
      fileEl.value = "";
    };
    rd.onerror = function(){ toast("파일을 읽는 중 오류가 발생했습니다.", "err"); };
    rd.readAsText(f);
  });
}

/* =========================================================
   20) 부팅
   ========================================================= */
function boot(){
  var t = store.get(K_THEME);
  if(t !== "dark" && t !== "light"){
    var mq = false;
    try{ mq = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches; }catch(e){}
    t = mq ? "dark" : "light";
  }
  applyTheme(t);

  var note = $("#envNote");
  if(note){
    if(!SECURE){
      note.hidden = false;
      note.className = "env-note";
      note.innerHTML = svg("shield") + "<span>안전 접속(HTTPS)에서 더 강한 암호화가 적용됩니다. 현재 페이지는 내장 SHA-256 폴백으로 동작합니다.</span>";
    } else { note.hidden = true; }
  }
  var pc = $("#pvClose"); if(pc) pc.innerHTML = svg("x");
  var fab = $(".pv-fab"); if(fab) fab.innerHTML = svg("eye");
  updateChrome();

  hashHex(DEFAULT_PW).then(function(defHash){
    if(!store.get(K_PW)) store.set(K_PW, defHash);
    var cur = store.get(K_PW);
    var tk = store.get(K_SESS, "session") || store.get(K_SESS);
    if(tk && cur && tk === sessionToken(cur)){ enterApp(); }
    else {
      paintLock();
      var inp = $("#pwIn"); if(inp){ try{ inp.focus(); }catch(e){} }
    }
  });
}
if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
else boot();

})();
</script>
