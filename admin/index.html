<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#060f1e">
<title>KAHUGO 플랫폼 관리자 편집 모드</title>
<link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
<style>
/* ── 관리자 전용 스타일(사이트 디자인 토큰과 같은 색) ── */
:root{--bg:#060f1e;--bg2:#0a1729;--sf:#0e1d33;--sf2:#13253f;--sf3:#1a3152;--line:rgba(150,182,228,.16);--line2:rgba(150,182,228,.3);--ink:#edf3fc;--sub:#b0c1d8;--mute:#8296b2;--brand:#3b86f8;--cyan:#19c3dc;--gold:#f4c85e;--ok:#34d6a6;--danger:#ff7488;--grad:linear-gradient(135deg,#2f7df6,#16b6d6);--r:12px;--font:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
html[data-theme="light"]{--bg:#f4f7fc;--bg2:#eaf0f8;--sf:#fff;--sf2:#f3f6fb;--sf3:#e6edf7;--line:#dde5f0;--line2:#c6d3e4;--ink:#0f1c33;--sub:#3f516b;--mute:#66788f;--brand:#1f62d6;--cyan:#0a8fae;--gold:#a8750a;--ok:#0f9a6f;--danger:#d63a52}
*{box-sizing:border-box;min-width:0}html,body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.6 var(--font);word-break:keep-all;overflow-wrap:anywhere;-webkit-text-size-adjust:100%}
svg:not([width]){width:1.2em;height:1.2em}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;background:none;border:0;padding:0}a{color:var(--cyan)}
h1,h2,h3,p{margin:0}h1{font-size:18px}h2{font-size:16.5px;letter-spacing:-.02em}h3{font-size:14.5px}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top));background:var(--bg2);border-bottom:1px solid var(--line)}
.top img{width:30px;height:30px;border-radius:8px}.top b{font-size:14px}.top .sp{flex:1}
.badge{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:99px;font-size:11.5px;font-weight:800;background:var(--sf2);color:var(--sub);border:1px solid var(--line);white-space:nowrap}
.badge.ok{color:var(--ok);background:rgba(52,214,166,.12);border-color:transparent}.badge.warn{color:var(--gold);background:rgba(244,200,94,.12);border-color:transparent}.badge.bad{color:var(--danger);background:rgba(255,116,136,.12);border-color:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 15px;border-radius:99px;font-weight:750;font-size:14px;border:1px solid var(--line2);background:var(--sf);white-space:nowrap}
.btn.pri{background:var(--grad);color:#fff;border-color:transparent}.btn.danger{color:var(--danger);border-color:rgba(255,116,136,.4)}.btn.sm{min-height:40px;padding:0 12px;font-size:13px}.btn.block{width:100%}.btn[disabled]{opacity:.45;pointer-events:none}
.ib{width:40px;height:40px;display:inline-grid;place-items:center;border-radius:10px;color:var(--sub);border:1px solid transparent}.ib:hover{background:var(--sf2);color:var(--ink)}
.layout{display:grid;grid-template-columns:1fr;min-height:calc(100vh - 56px)}
.side{display:flex;gap:4px;overflow-x:auto;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:56px;z-index:15;scrollbar-width:none}.side::-webkit-scrollbar{display:none}
.side button{flex:0 0 auto;display:flex;align-items:center;gap:7px;min-height:40px;padding:0 13px;border-radius:99px;font-weight:700;color:var(--sub);white-space:nowrap}
.side button[aria-current="true"]{background:var(--ink);color:var(--bg)}
.main{padding:16px 14px 120px;max-width:980px;width:100%}
.card{background:var(--sf);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.between{justify-content:space-between}.stack>*+*{margin-top:10px}
.muted{color:var(--mute)}.sub{color:var(--sub)}.xs{font-size:12px}.sm{font-size:13px}.mt{margin-top:12px}.mt2{margin-top:20px}
.f{display:block;margin-bottom:12px}.f>span{display:block;font-size:12.5px;font-weight:700;color:var(--sub);margin-bottom:5px}.f small{display:block;font-size:11.5px;color:var(--mute);margin-top:4px}
.in,.ta,.sel{width:100%;min-height:44px;padding:9px 12px;border-radius:10px;background:var(--sf2);border:1px solid var(--line2);color:var(--ink);font-size:16px;-webkit-appearance:none;appearance:none}
.ta{min-height:96px;resize:vertical;line-height:1.55}.ta.big{min-height:420px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13.5px}
.in:focus,.ta:focus,.sel:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(59,134,248,.18)}
.ck{display:flex;align-items:center;gap:8px;min-height:40px;font-weight:600}.ck input{width:20px;height:20px;accent-color:var(--brand)}
.list .it{display:flex;align-items:center;gap:6px;padding:8px 8px 8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--sf2);margin-bottom:6px}
.list .it .t{flex:1;font-weight:650;font-size:13.5px;cursor:pointer;min-height:36px;display:flex;align-items:center;text-align:left}
.list .it.on{border-color:var(--brand);background:rgba(59,134,248,.1)}
.grid2{display:grid;grid-template-columns:1fr;gap:0 12px}
.note{padding:11px 13px;border-radius:10px;background:var(--sf2);border:1px solid var(--line);font-size:12.5px;color:var(--sub)}
.note.warn{border-color:rgba(244,200,94,.4);background:rgba(244,200,94,.08)}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login .card{width:100%;max-width:400px;padding:24px}

.pv{position:fixed;top:56px;right:0;bottom:0;width:min(480px,100vw);background:var(--bg);border-left:1px solid var(--line);z-index:30;display:flex;flex-direction:column;transform:translateX(105%);transition:transform .25s}
.pv.on{transform:none}.pv iframe{flex:1;width:100%;border:0;background:#060f1e}.pv .bar{display:flex;align-items:center;gap:6px;padding:8px;border-bottom:1px solid var(--line)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--bg2);border-top:1px solid var(--line)}
.dock .btn{flex:1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}.kv dt{color:var(--mute)}.kv dd{margin:0}
table.t{width:100%;border-collapse:collapse;font-size:13px}table.t td,table.t th{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.wrapx{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
details>summary{cursor:pointer;font-weight:700;padding:6px 0}
@media(min-width:1200px){body.pv-open .main{margin-right:480px;width:auto;max-width:none}body.pv-open .dock{right:480px}}
@media(min-width:900px){.layout{grid-template-columns:230px 1fr}.side{flex-direction:column;position:sticky;top:56px;height:calc(100vh - 56px);border-bottom:0;border-right:1px solid var(--line);overflow:auto;padding:12px}.side button{border-radius:10px}.main{padding:22px 26px 120px}.grid2{grid-template-columns:1fr 1fr}.dock{left:230px}.edit2{display:grid;grid-template-columns:280px 1fr;gap:14px;align-items:start}}
</style>

  function input(f, v, path) {
    var id = 'fx-' + path.replace(/[^\w-]/g, '_'), dp = ' data-path="' + esc(path) + '" data-t="' + f.t + '"', help = f.help ? '<small>' + esc(f.help) + '</small>' : '';
    if (f.t === 'bool') return '<label class="ck"><input type="checkbox" id="' + id + '"' + dp + (v ? ' checked' : '') + '> ' + esc(f.l) + '</label>';
    var lab = '<label class="f" for="' + id + '"><span>' + esc(f.l) + '</span>';
    if (f.t === 'textarea') return lab + '<textarea class="ta" id="' + id + '"' + dp + '>' + esc(v || '') + '</textarea>' + help + '</label>';
    if (f.t === 'lines' || f.t === 'nums') return lab + '<textarea class="ta" id="' + id + '"' + dp + '>' + esc((v || []).join('\n')) + '</textarea>' + help + '</label>';
    if (f.t === 'pairs') return lab + '<textarea class="ta" id="' + id + '"' + dp + '>' + esc((v || []).map(function (c) { return c.label + '|' + c.route; }).join('\n')) + '</textarea>' + help + '</label>';
    if (f.t === 'select') {
      var opts = f.opts || (getP(S.draft, f.from) || []).map(function (x) { return x.id; });
      if (v != null && opts.indexOf(v) < 0) opts = [v].concat(opts);
      return lab + '<select class="sel" id="' + id + '"' + dp + '>' + opts.map(function (o) { return '<option value="' + esc(o) + '"' + (o === v ? ' selected' : '') + '>' + esc(o === '' ? '(없음)' : o) + '</option>'; }).join('') + '</select>' + help + '</label>';
    }
    return lab + '<input class="in" id="' + id + '" type="' + (f.t === 'number' ? 'number' : 'text') + '"' + dp + ' value="' + esc(v == null ? '' : v) + '">' + help + '</label>';
  }
  function readVal(el) {
    var t = el.getAttribute('data-t');
    if (t === 'bool') return el.checked;
    if (t === 'number') return el.value === '' ? null : +el.value;
    if (t === 'lines') return el.value.split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
    if (t === 'nums') return el.value.split('\n').map(function (s) { return parseInt(s, 10); }).filter(function (n) { return !isNaN(n); });
    if (t === 'pairs') return el.value.split('\n').map(function (s) { var p = s.split('|'); return p[0] && p[1] ? { label: p[0].trim(), route: p[1].trim() } : null; }).filter(Boolean);
    return el.value;
  }

    var pw = $('#pw'); setTimeout(function () { try { pw.focus(); } catch (e) {} }, 50);
    $('#login-form').addEventListener('submit', function (e) {
      e.preventDefault(); var v = pw.value;
      if (!v) { paintLogin('비밀번호를 입력해 주세요.'); return; }

      } else {
        var stored = LS.get('pw', null), fails = LS.get('fails', { n: 0, t: 0 });
        if (fails.n >= 5 && Date.now() - fails.t < 5 * 60e3) { paintLogin('5회 틀렸어요. 5분 뒤 다시 시도해 주세요.'); return; }
        DEFAULT_HASH = DEFAULT_HASH || pwHash(DEFAULT_PW); var ok = stored ? pwHash(v) === stored : pwHash(v) === DEFAULT_HASH;
        if (!ok) { LS.set('fails', { n: fails.n + 1, t: Date.now() }); paintLogin('비밀번호가 맞지 않습니다.'); return; }
        LS.del('fails'); try { sessionStorage.setItem('kahugo9:admin:a', '1'); } catch (e3) {} enter();
      }
    });

    theme: function () { var t = D.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light'; D.documentElement.setAttribute('data-theme', t); LS.set('theme', t); },
    logout: function () { try { sessionStorage.removeItem('kahugo9:admin:token'); sessionStorage.removeItem('kahugo9:admin:a'); } catch (e) {} S.token = null; paintLogin(); },
    'pw-reset': function () { if (!W.confirm('이 브라우저의 관리자 비밀번호를 기본값으로 되돌릴까요?')) return; LS.del('pw'); toast('기본 비밀번호로 되돌렸어요'); paintMain(); },
    mod: function (el) { var v = el.getAttribute('data-v'); if (v === 'delete' && !W.confirm('이 글을 완전히 삭제할까요?')) return; api('admin/moderate', { method: 'POST', body: { postId: el.getAttribute('data-id'), action: v } }).then(function () { toast('처리했어요'); inboxLoad(); }).catch(function (e) { toast('실패: ' + e.message); }); },
    csv: function (el) { var w = el.getAttribute('data-w'), rows = (S._inbox && S._inbox[w]) || []; if (!rows.length) { toast('내려받을 데이터가 없어요'); return; } var keys = Object.keys(rows[0]); var csv = '﻿' + keys.join(',') + '\n' + rows.map(function (r) { return keys.map(function (k) { return '"' + String(r[k] == null ? '' : r[k]).replace(/"/g, '""') + '"'; }).join(','); }).join('\n'); download('kahugo-' + w + '.csv', csv, 'text/csv'); }
  };
  D.addEventListener('click', function (e) { var el = e.target.closest && e.target.closest('[data-a]'); if (!el) return; var f = ACT[el.getAttribute('data-a')]; if (f) { e.preventDefault(); f(el, e); } });
  D.addEventListener('submit', function (e) {
    if (e.target.id !== 'pw-form') return; e.preventDefault();
    var c = $('#pw0').value, n = $('#pw1').value, n2 = $('#pw2').value, msg = $('#pw-msg');
    var err = function (t) { msg.hidden = false; msg.textContent = t; };
    if (n.length < 8 || !/[A-Za-z]/.test(n) || !/\d/.test(n)) return err('새 비밀번호는 8자 이상, 영문과 숫자를 함께 써 주세요.');
    if (n !== n2) return err('새 비밀번호 두 칸이 서로 달라요.');
    if (S.mode === 'B') { api('admin/password', { method: 'POST', body: { current: c, next: n } }).then(function (j) { if (j && j.token) { S.token = j.token; try { sessionStorage.setItem('kahugo9:admin:token', j.token); } catch (e3) {} } toast('서버 비밀번호를 바꿨어요 · 다른 기기의 로그인은 모두 끊겼습니다'); $('#pw-form').reset(); msg.hidden = true; }).catch(function (e2) { err(e2.status === 401 ? '현재 비밀번호가 맞지 않아요.' : '변경 실패: ' + e2.message); }); return; }
    DEFAULT_HASH = DEFAULT_HASH || pwHash(DEFAULT_PW); var stored = LS.get('pw', null), ok = stored ? pwHash(c) === stored : pwHash(c) === DEFAULT_HASH;
    if (!ok) return err('현재 비밀번호가 맞지 않아요.');
    LS.set('pw', pwHash(n)); toast('비밀번호를 바꿨어요'); $('#pw-form').reset(); msg.hidden = true; paintMain();
  });
  W.addEventListener('beforeunload', function () { /* 임시 저장은 자동 */ });

  /* ── 시작 ── */
  var th = LS.get('theme', null); if (th) D.documentElement.setAttribute('data-theme', th);
  probe().then(function (on) {
    S.mode = on ? 'B' : 'A';
    try { S.token = sessionStorage.getItem('kahugo9:admin:token'); } catch (e) {}
    var aIn = false; try { aIn = sessionStorage.getItem('kahugo9:admin:a') === '1'; } catch (e) {}
    if ((S.mode === 'B' && S.token) || (S.mode === 'A' && aIn)) enter(); else paintLogin();
  });
})();
</script>
